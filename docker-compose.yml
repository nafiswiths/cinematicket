version: "3.9"

# CinemaSeat docker-compose
# Runs: api (Spring Boot), postgres, gateway (provided mock), frontend (nginx).
#
# From a clean clone:
#   cp .env.example .env
#   docker compose up --build
#
# Services reach each other by service name. The backend talks to:
#   - postgres:5432 via DATABASE_URL
#   - http://gateway:9000 via GATEWAY_URL
#   - and exposes its callback URL to the gateway as http://api:8080/api/payments/callback
#     (NEVER localhost, because the gateway container cannot reach the host that way).
#     Port 8080 matches Agent 1's backend default (server.port: ${API_PORT:8080}).

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinemaseat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    container_name: cinemaseat-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    healthcheck:
      # The image binds only to the container's published bridge IP, so
      # localhost:9000 from inside is refused. Probe via /charge (always 202)
      # against the host-side bridge IP — Docker injects this as `host.docker.internal`
      # on Docker Desktop, and as the container's own IP on Linux bridges.
      # Falling back to /debug/config keeps the check robust on either platform.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinemaseat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS}
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # The gateway must be able to reach the backend by Docker service name.
      # API_PORT must match the exposed port below.
      # Default 8080 matches Agent 1's Spring Boot default in
      # backend/src/main/resources/application.yml (`server.port: ${API_PORT:8080}`).
      API_PORT: ${API_PORT:-8080}
      CALLBACK_URL: http://api:${API_PORT:-8080}/api/payments/callback
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: cinemaseat-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # nginx template substitutes this into ${API_UPSTREAM} at container start.
      # In Compose this is the docker-network DNS of the api service. In Render
      # the blueprint overrides it with the API service's internal URL.
      API_UPSTREAM: api:${API_PORT:-8080}

volumes:
  postgres-data:
