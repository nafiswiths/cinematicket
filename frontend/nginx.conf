server {
    listen 80;
    server_name _;

    # Static SPA
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy /api/* to the backend. The upstream hostname is supplied at
    # container start via the API_UPSTREAM env var (defaults to "api:8080" for
    # local docker-compose). Render sets this to the API service's internal DNS.
    location /api/ {
        proxy_pass http://${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback: any unknown path returns index.html so client-side
    # routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
