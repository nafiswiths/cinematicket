# Render Blueprint — CinemaSeat
# One file describes the entire stack: Postgres + Spring Boot API + React frontend
# + mock gateway (kept on Render as a private service).
#
# To deploy:
#   1. Push this repo to GitHub.
#   2. In Render: New -> Blueprint -> point at this repo.
#   3. Render reads this file and provisions everything below.
#
# Env-var names below match what backend/src/main/resources/application.yml reads:
#   DATABASE_URL, POSTGRES_USER, POSTGRES_PASSWORD, GATEWAY_URL, GATEWAY_SECRET,
#   HOLD_TTL_SECONDS, API_PORT, CALLBACK_URL.

services:
  # ---- Database ----------------------------------------------------------
  - type: pserv
    name: cinemaseat-postgres
    plan: starter
    region: oregon
    ipAllowList: []                 # only internal services can reach it
    envVars:
      - key: POSTGRES_DB
        value: cinemaseat
      - key: POSTGRES_USER
        value: cinemaseat
      - key: POSTGRES_PASSWORD
        generateValue: true         # Render generates and stores it

  # ---- Mock payment/OTP gateway -----------------------------------------
  # We run the same official image Render allows. It is internal (no
  # external URL) and only the API talks to it.
  - type: pserv
    name: cinemaseat-gateway
    plan: starter
    region: oregon
    ipAllowList: []
    runtime: docker
    docker:
      image: asifmahmoud414/mock-gateway:latest
    healthCheckPath: /health

  # ---- Backend (Spring Boot) --------------------------------------------
  # Spring Boot reads env vars directly via application.yml's ${...} defaults.
  # No separate "render" profile is needed — every setting is parameterized.
  - type: pserv
    name: cinemaseat-api
    plan: starter
    region: oregon
    runtime: docker
    docker:
      dockerfile: ./backend/Dockerfile
      context: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinemaseat-postgres
          property: connectionString
      - key: POSTGRES_DB
        value: cinemaseat
      - key: POSTGRES_USER
        value: cinemaseat
      - key: POSTGRES_PASSWORD
        fromService:
          type: pserv
          name: cinemaseat-postgres
          property: password
      - key: HOLD_TTL_SECONDS
        value: 120
      - key: GATEWAY_URL
        value: http://cinemaseat-gateway:9000
      - key: GATEWAY_SECRET
        value: z2p-2026-secret
      - key: API_PORT
        value: 8080
      # The gateway must reach us by service name + port.
      - key: CALLBACK_URL
        value: http://cinemaseat-api:8080/api/payments/callback

  # ---- Frontend (React SPA + nginx) -------------------------------------
  - type: pserv
    name: cinemaseat-frontend
    plan: starter
    region: oregon
    runtime: docker
    docker:
      dockerfile: ./frontend/Dockerfile
      context: .
      args:
        # Same-origin path: nginx in this image reverse-proxies /api/* to the
        # API service. We don't bake the API URL into the bundle.
        VITE_API_BASE_URL: /api
    envVars:
      # Backend URL that nginx proxies to. The docker-entrypoint.sh in the
      # frontend image substitutes this into nginx.conf at container start.
      - key: API_UPSTREAM
        value: http://cinemaseat-api:8080